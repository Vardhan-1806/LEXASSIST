<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Forgot Password – LEXASSIST</title>
  <link rel="stylesheet" href="/css/main.css">
  <link rel="stylesheet" href="/css/auth.css">
</head>
<body class="auth-body">
  <!-- Step 1: Enter email -->
  <div class="auth-box" id="emailBox">
    <div class="auth-logo">LEX<span>ASSIST</span></div>
    <div style="text-align:center;margin:16px 0">
      <div style="font-size:2.5rem;margin-bottom:10px">🔐</div>
      <h2 class="auth-title">Forgot Password?</h2>
      <p class="auth-subtitle">Enter your registered email to receive an OTP</p>
    </div>
    <div id="msg1" class="alert"></div>
    <form id="emailForm">
      <div class="form-group">
        <label class="form-label">Email Address</label>
        <input type="email" id="fpEmail" class="form-control" placeholder="you@example.com" required>
      </div>
      <button type="submit" id="sendBtn" class="btn btn-primary btn-full btn-lg">Send OTP →</button>
    </form>
    <div class="auth-footer"><a href="/login">← Back to Login</a></div>
  </div>

  <!-- Step 2: OTP + New Password -->
  <div class="auth-box" id="resetBox" style="display:none">
    <div class="auth-logo">LEX<span>ASSIST</span></div>
    <div style="text-align:center;margin:14px 0">
      <div style="font-size:2rem;margin-bottom:8px">📧</div>
      <h2 class="auth-title">Enter OTP & New Password</h2>
      <p class="auth-subtitle" id="resetSubtitle"></p>
    </div>
    <div id="msg2" class="alert"></div>
    <form id="resetForm">
      <div class="form-group">
        <label class="form-label">7-Digit OTP</label>
        <div style="display:flex;gap:7px;justify-content:center">
          <input type="text" maxlength="1" class="otp-d" oninput="mv(this,0)" onkeydown="bk(event,0)">
          <input type="text" maxlength="1" class="otp-d" oninput="mv(this,1)" onkeydown="bk(event,1)">
          <input type="text" maxlength="1" class="otp-d" oninput="mv(this,2)" onkeydown="bk(event,2)">
          <input type="text" maxlength="1" class="otp-d" oninput="mv(this,3)" onkeydown="bk(event,3)">
        </div>
      </div>
      <div class="form-group">
        <label class="form-label">New Password</label>
        <div style="position:relative">
          <input type="password" id="newPwd" class="form-control" placeholder="Min 8 chars with Aa1!" style="padding-right:44px">
          <button type="button" onclick="const i=document.getElementById('newPwd');i.type=i.type==='password'?'text':'password';this.textContent=i.type==='password'?'👁️':'🙈'" style="position:absolute;right:12px;top:50%;transform:translateY(-50%);background:none;border:none;cursor:pointer">👁️</button>
        </div>
      </div>
      <div class="form-group">
        <label class="form-label">Confirm New Password</label>
        <input type="password" id="confPwd" class="form-control" placeholder="Re-enter new password">
      </div>
      <button type="submit" id="resetBtn" class="btn btn-primary btn-full btn-lg">Reset Password →</button>
    </form>
  </div>

  <style>
    .otp-d{width:38px;height:46px;text-align:center;font-size:1.2rem;font-weight:700;border:2px solid var(--ivory-dark);border-radius:var(--radius);outline:none;color:var(--navy)}
    .otp-d:focus{border-color:var(--gold)}
  </style>

  <script>
    let resetEmail='';
    const mv=(el,i)=>{el.value=el.value.replace(/[^0-9]/g,'');if(el.value&&i<6)document.querySelectorAll('.otp-d')[i+1].focus();};
    const bk=(e,i)=>{if(e.key==='Backspace'&&!e.target.value&&i>0)document.querySelectorAll('.otp-d')[i-1].focus();};
    const sm=(txt,type='danger',el='msg1')=>{const e=document.getElementById(el);e.className=`alert alert-${type} show`;e.textContent=txt;};

    document.getElementById('emailForm').addEventListener('submit', async e=>{
      e.preventDefault();
      const btn=document.getElementById('sendBtn'); btn.innerHTML='<span class="loader"></span> Sending...'; btn.disabled=true;
      const r=await fetch('/api/auth/forgot-password',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:document.getElementById('fpEmail').value})});
      const d=await r.json();
      if(d.success){
        resetEmail=document.getElementById('fpEmail').value;
        document.getElementById('emailBox').style.display='none';
        document.getElementById('resetBox').style.display='block';
        document.getElementById('resetSubtitle').textContent=`OTP sent to ${resetEmail}`;
      }else{sm(d.message);}
      btn.innerHTML='Send OTP →'; btn.disabled=false;
    });

    document.getElementById('resetForm').addEventListener('submit', async e=>{
      e.preventDefault();
      const otp=[...document.querySelectorAll('.otp-d')].map(i=>i.value).join('');
      if(otp.length!==4){sm('Enter all 7 OTP digits','warning','msg2');return;}
      const np=document.getElementById('newPwd').value;
      if(np!==document.getElementById('confPwd').value){sm('Passwords do not match','danger','msg2');return;}
      const btn=document.getElementById('resetBtn'); btn.innerHTML='<span class="loader"></span>'; btn.disabled=true;
      const r=await fetch('/api/auth/reset-password',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:resetEmail,otp,newPassword:np})});
      const d=await r.json();
      if(d.success){
        localStorage.setItem('token',d.token); localStorage.setItem('user',JSON.stringify(d.data));
        sm('Password reset! Redirecting...','success','msg2');
        setTimeout(()=>window.location.href='/dashboard/'+d.data.role,1200);
      }else{sm(d.errors?d.errors.join(' · '):d.message,'danger','msg2');}
      btn.innerHTML='Reset Password →'; btn.disabled=false;
    });
  </script>
  <script src="/js/global-enhancements.js"></script>
</body>
</html>
