<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Page Not Found – LEXASSIST</title>
  <link rel="stylesheet" href="/css/main.css">
  <link rel="stylesheet" href="/css/auth.css">
</head>
<body class="auth-body">
  <div style="text-align:center;max-width:420px">
    <div style="font-family:'Playfair Display',serif;font-size:7rem;font-weight:900;color:var(--gold);line-height:1">404</div>
    <h2 style="color:var(--white);margin:10px 0 8px">Page Not Found</h2>
    <p style="color:rgba(255,255,255,0.55);margin-bottom:28px">The page you're looking for doesn't exist or has been moved.</p>
    <div style="display:flex;gap:12px;justify-content:center;flex-wrap:wrap">
      <a href="/"                     class="btn btn-primary">← Go Home</a>
      <a href="javascript:history.back()" class="btn btn-secondary">Go Back</a>
    </div>
  </div>
  <script src="/js/global-enhancements.js"></script>
</body>
</html>
